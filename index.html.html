<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Lily Bouquet</title>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#9aa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font:14px ui-monospace,Menlo,Consolas,monospace}
body{display:grid;place-items:center}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
if(!window.THREE){document.body.textContent='Three.js failed to load. Check your connection.';return}
const T=THREE,V=T.Vector3,TAU=Math.PI*2,S=3,RAMP=' .,:;!+*ox%#@';
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
const rng=(a=>()=>{let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296})(11);
const R=(a=0,b=1)=>a+rng()*(b-a);
const mix=(a,b,t)=>a+(b-a)*t,sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const mc=(a,b,t)=>[mix(a[0],b[0],t),mix(a[1],b[1],t),mix(a[2],b[2],t)];
const hash=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)};

/* ---------- Three.js scene (rendered offscreen into low-res targets) ---------- */
let renderer;
try{renderer=new T.WebGLRenderer({antialias:false,alpha:true,powerPreference:'high-performance'})}
catch(e){document.body.textContent='WebGL is not available in this browser.';return}
renderer.setClearColor(0,0);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;
const scene=new T.Scene(),cam=new T.PerspectiveCamera(36,1,5,60);
scene.fog=new T.Fog(0,10,25);
const rtOpt={minFilter:T.NearestFilter,magFilter:T.NearestFilter};
const rtC=new T.WebGLRenderTarget(4,4,rtOpt),rtD=new T.WebGLRenderTarget(4,4,rtOpt);
const depthMat=new T.ShaderMaterial({side:T.DoubleSide,
 vertexShader:'varying float z;void main(){vec4 p=modelViewMatrix*vec4(position,1.);z=-p.z;gl_Position=projectionMatrix*p;}',
 fragmentShader:'varying float z;void main(){float v=clamp((z-5.)/55.,0.,.9999)*255.;gl_FragColor=vec4(floor(v)/255.,fract(v),0.,1.);}'});

scene.add(new T.HemisphereLight(0xfff4e8,0x2c2038,.8));
const key=new T.DirectionalLight(0xffffff,1);key.position.set(-4.5,8,7);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:1,far:30});
key.shadow.bias=-.0006;key.shadow.normalBias=.04;scene.add(key);
const rim=new T.DirectionalLight(0xffb070,.55);rim.position.set(6,3,-6);scene.add(rim);
const fill=new T.DirectionalLight(0x8090ff,.25);fill.position.set(5,-2,6);scene.add(fill);

/* Two-layer (thick) parametric surface; fn(i,u,v,layer) -> [x,y,z,nx,ny,nz,thickness,[r,g,b]] */
function surf(nu,nv,fn,mat){
 const P=[],C=[],I=[];
 for(let L=0;L<2;L++){
  const s=L?-1:1,b0=P.length/3;
  for(let i=0;i<=nu;i++)for(let j=0;j<=nv;j++){
   const r=fn(i,i/nu,j/nv*2-1,s);
   P.push(r[0]+r[3]*s*r[6],r[1]+r[4]*s*r[6],r[2]+r[5]*s*r[6]);C.push(...r[7]);
  }
  for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){
   const a=b0+i*(nv+1)+j,b=a+1,c=a+nv+1,d=c+1;
   L?I.push(a,c,b,b,c,d):I.push(a,b,c,b,d,c);
  }
 }
 const g=new T.BufferGeometry();
 g.setAttribute('position',new T.Float32BufferAttribute(P,3));
 g.setAttribute('color',new T.Float32BufferAttribute(C,3));
 g.setIndex(I);g.computeVertexNormals();
 return new T.Mesh(g,mat);
}
const pMat=new T.MeshStandardMaterial({vertexColors:true,roughness:.5,side:T.DoubleSide});
const lMat=new T.MeshStandardMaterial({vertexColors:true,roughness:.6,side:T.DoubleSide});
const stemMat=new T.MeshStandardMaterial({color:0x3f7d2c,roughness:.7});
const fMat=new T.MeshStandardMaterial({color:0xe6edb8,roughness:.6});
const aMat=new T.MeshStandardMaterial({color:0xb4501a,emissive:0x74300a,roughness:.7});
const pistMat=new T.MeshStandardMaterial({color:0xcfe29a,roughness:.55});

const PAL=[ // throat, body, tip, edge, spot
 {a:[1,.85,.35],b:[.78,.03,.09],c:[.95,.14,.17],e:[1,.4,.38],s:[.25,0,.03]},      // vivid red
 {a:[1,.8,.4],b:[.82,.05,.48],c:[.95,.22,.62],e:[1,.55,.82],s:[.32,0,.17]},       // magenta
 {a:[1,.95,.6],b:[1,.42,.68],c:[1,.62,.8],e:[1,.85,.92],s:[.68,.1,.33]},          // pink
 {a:[1,.95,.5],b:[1,.74,.04],c:[1,.84,.22],e:[1,.95,.6],s:[.6,.24,.02]},          // golden yellow
 {a:[.8,.93,.45],b:[1,.97,.86],c:[1,.99,.93],e:[1,1,1],s:null},                   // creamy white
 {a:[1,.8,.2],b:[1,.44,.02],c:[1,.6,.1],e:[1,.8,.4],s:[.45,.12,0]}];              // orange

/* One tepal: recurved centerline, tapered tip, cupped body, rolled & wavy margins, vertex-baked colour + AO */
function petal(o,pal,sd,tint){
 const nu=24,nv=10,Cn=[[0,0]],al=u=>o.a0+(o.a1-o.a0)*Math.pow(u,1.4);
 for(let i=1;i<=nu;i++){const a=al((i-.5)/nu),d=o.L/nu;Cn.push([Cn[i-1][0]+Math.sin(a)*d,Cn[i-1][1]+Math.cos(a)*d])}
 const cp=Math.cos(o.phi),sp=Math.sin(o.phi);
 return surf(nu,nv,(i,u,v,s)=>{
  const a=al(u),ca=Math.cos(a),sa=Math.sin(a),ev=Math.abs(v),j=Math.round((v+1)/2*nv);
  const w=o.W*(.07*(1-u)+Math.pow(Math.sin(Math.PI*Math.pow(u,.78)),.8)),sx=v*w;
  const off=o.cup*v*v*w*(.9-1.6*u)+o.wave*Math.pow(ev,2.2)*w*Math.sin(u*o.fr*TAU+o.ph);
  const rr=Cn[i][0]-ca*off,y=Cn[i][1]+sa*off;
  let c=mc(pal.a,pal.b,sm(0,.3,u));c=mc(c,pal.c,sm(.5,1,u));c=mc(c,pal.e,.55*ev*ev*ev);
  if(pal.s&&u>.1&&u<.65&&ev<.8&&hash(i+sd,j*1.7+sd)>.84)c=mc(c,pal.s,.85);
  if(s<0)c=mc(c,[.62,.8,.38],.4*(1-sm(0,.55,u)));
  const k=(s<0?.88:1)*tint*(.28+.72*sm(0,.5,u))*(.82+.18*ev);
  return[cp*rr-sp*sx,y,sp*rr+cp*sx,-ca*cp,sa,-ca*sp,.006+.02*(1-v*v)*(1-.5*u),[c[0]*k,c[1]*k,c[2]*k]];
 },pMat);
}
/* Long lanceolate leaf with channelled midrib */
function leaf(p,phi,e0,len,wid,bend,sd){
 const cp=Math.cos(phi),sp=Math.sin(phi),ce=Math.cos(e0),se=Math.sin(e0);
 return surf(18,6,(i,u,v,s)=>{
  const l=u*len,w=wid*(.04+Math.pow(Math.sin(Math.PI*Math.pow(u,.6)),.9));
  const tx=cp*ce,ty=se-2*bend*l,tz=sp*ce,tl=Math.hypot(tx,ty,tz);
  const nx=-cp*ty/tl,ny=(cp*tx+sp*tz)/tl,nz=-sp*ty/tl;
  const off=.35*Math.abs(v)*w+.05*Math.sin(u*14+sd)*v*v*w;
  let c=mc([.07,.25,.06],[.3,.62,.16],sm(0,.8,u));c=mc(c,[.55,.78,.35],.5*Math.exp(-v*v*50));
  const k=(s<0?.85:1)*(.45+.55*sm(0,.35,u));
  return[p.x+cp*ce*l-sp*v*w+nx*off,p.y+se*l-bend*l*l+ny*off,p.z+sp*ce*l+cp*v*w+nz*off,nx,ny,nz,.008,[c[0]*k,c[1]*k,c[2]*k]];
 },lMat);
}
/* Full lily head: 3 outer + 3 inner tepals, 6 stamens with anthers, pistil. Local +Y is the flower axis. */
function lily(pal,sd){
 const g=new T.Group(),tint=.9+.2*hash(sd,3);
 for(let k=0;k<6;k++){
  const out=k%2===0;
  g.add(petal({L:R(1.1,1.3)*(out?1.05:1),W:out?.21:.3,a0:R(.8,1.05)+(out?.12:0),a1:R(1.95,2.35),phi:k*Math.PI/3+R(-.07,.07),
   cup:R(.45,.7),wave:R(.25,.45),fr:R(2,3.2),ph:R(0,TAU)},pal,sd+k*5.3,tint));
 }
 for(let k=0;k<6;k++){
  const th=k*Math.PI/3+.3+R(-.15,.15),c=Math.cos(th),s=Math.sin(th),r2=R(.3,.42);
  const cu=new T.QuadraticBezierCurve3(new V(0,0,0),new V(c*.08,.55,s*.08),new V(c*r2,R(.85,1),s*r2));
  g.add(new T.Mesh(new T.TubeGeometry(cu,8,.012,4),fMat));
  const an=new T.Mesh(new T.SphereGeometry(1,8,6),aMat);an.scale.set(.04,.17,.04);
  an.position.copy(cu.getPoint(1));an.quaternion.setFromUnitVectors(new V(0,1,0),new V(-s,.2,c).normalize());g.add(an);
 }
 const pc=new T.QuadraticBezierCurve3(new V(0,0,0),new V(0,.6,0),new V(.1,1.1,.05));
 g.add(new T.Mesh(new T.TubeGeometry(pc,8,.02,5),pistMat));
 const st=new T.Mesh(new T.SphereGeometry(.05,8,6),pistMat);st.scale.set(1.3,.8,1.3);st.position.copy(pc.getPoint(1));g.add(st);
 return g;
}
function bud(){
 const g=new T.Group(),b=new T.Mesh(new T.SphereGeometry(.17,10,8),new T.MeshStandardMaterial({color:0x8fbf5a,roughness:.6}));
 b.scale.set(1,3.4,1);b.position.y=.5;
 const t=new T.Mesh(new T.SphereGeometry(.12,10,8),new T.MeshStandardMaterial({color:0xe05c98,roughness:.5}));
 t.scale.set(1,2.6,1);t.position.y=.9;g.add(b,t);return g;
}

/* ---------- Bouquet composition ---------- */
const tilt=new T.Group(),spin=new T.Group(),units=[];
tilt.add(spin);scene.add(tilt);tilt.rotation.x=.14;tilt.position.y=-3.1;
function addUnit(H,ax,sc,head,leaves){
 const u=new T.Group(),B=new V(R(-.12,.12),0,R(-.12,.12)),mid=B.clone().lerp(H,.3);mid.x*=.75;mid.z*=.75;
 const cu=new T.CatmullRomCurve3([B,mid,H.clone().addScaledVector(ax,-.9*sc),H.clone()]);
 u.add(new T.Mesh(new T.TubeGeometry(cu,28,.055,7),stemMat));
 head.position.copy(H);head.quaternion.setFromUnitVectors(new V(0,1,0),ax);head.rotateY(R(0,TAU));head.scale.setScalar(sc);u.add(head);
 const az=Math.atan2(H.z,H.x);
 for(let k=0;k<leaves;k++)u.add(leaf(cu.getPoint(R(.2,.6)),az+R(-1,1),R(.6,1.1),R(1.8,2.6),.17,R(.06,.12),R(0,9)));
 u.userData.p=R(0,TAU);spin.add(u);units.push(u);
}
const seq=[0,1,3,5,2,4,0,2,3,1,4];
seq.forEach((pi,i)=>{
 const f=Math.sqrt((i+.35)/seq.length),a=i*2.39996+.6,rad=.1+2.15*f;
 const H=new V(Math.cos(a)*rad,5.7-1.55*Math.pow(f,1.5)+R(-.2,.2),Math.sin(a)*rad);
 const ax=new V(Math.cos(a)*rad*.5+R(-.25,.25),1.2,Math.sin(a)*rad*.5+R(-.25,.25)).normalize();
 addUnit(H,ax,1.12-.3*f+R(-.04,.06),lily(PAL[pi],i*3.1),i<9?1:0);
});
[[-2.6,4.5,.9],[2.4,4.9,-1.1]].forEach(([x,y,z])=>addUnit(new V(x,y,z),new V(Math.sign(x)*.5,1,.15).normalize(),.9,bud(),0));
for(let k=0;k<6;k++)spin.add(leaf(new V(0,.5+k*.22,0),k*TAU/6+R(-.2,.2),R(.4,.75),R(2.6,3.2),.2,R(.07,.1),R(0,9)));
tilt.traverse(o=>{if(o.isMesh)o.castShadow=o.receiveShadow=true});

/* ---------- ASCII renderer: glyph masks rasterised once, blitted per frame ---------- */
let cols,rows,cw,ch,gw,gh,img,u32,bufC,bufD,filled,noise,glyphs;
const stars=[];
for(let i=0;i<260;i++){const m=i%5===0;stars.push({x:R(),y:R(),v:m?R(.004,.012):0,s:R(.8,3),ph:R(0,TAU),m:m?3:1+(R(0,3)|0),c:m?[255,205,120]:R()<.5?[190,200,255]:[255,200,230]})}

function buildGlyphs(){
 const c=document.createElement('canvas');c.width=cw;c.height=ch;
 const g=c.getContext('2d',{willReadFrequently:true});
 g.font='bold '+Math.round(cw/.6)+'px ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace';
 g.textAlign='center';g.textBaseline='middle';
 glyphs=[...RAMP].map(chr=>{
  g.clearRect(0,0,cw,ch);g.fillStyle='#fff';g.fillText(chr,cw/2,ch*.54);
  const d=g.getImageData(0,0,cw,ch).data,off=[],al=[];
  for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){const a=d[(y*cw+x)*4+3];if(a>10){off.push(y*gw+x);al.push(Math.min(255,a*1.25|0))}}
  return{off:Int32Array.from(off),al:Uint8Array.from(al)};
 });
}
function resize(){
 const W=innerWidth,H=innerHeight;let dpr=Math.min(devicePixelRatio||1,2);
 while(dpr>1&&W*H*dpr*dpr>6e6)dpr-=.25;
 const fs=Math.max(6,Math.min(W/190,H/66)); // CSS font size; cell aspect handled by camera aspect = canvas aspect
 cw=Math.max(3,Math.round(fs*.6*dpr));ch=Math.max(5,Math.round(fs*dpr));
 cols=Math.max(40,Math.floor(W*dpr/cw));rows=Math.max(20,Math.floor(H*dpr/ch));
 gw=cols*cw;gh=rows*ch;cv.width=gw;cv.height=gh;cv.style.width=gw/dpr+'px';cv.style.height=gh/dpr+'px';
 img=ctx.createImageData(gw,gh);u32=new Uint32Array(img.data.buffer);
 const rw=cols*S,rh=rows*S;rtC.setSize(rw,rh);rtD.setSize(rw,rh);bufC=new Uint8Array(rw*rh*4);bufD=new Uint8Array(rw*rh*4);
 filled=new Uint8Array(cols*rows);noise=Float32Array.from({length:cols*rows},Math.random);
 const asp=gw/gh,fit=Math.max(1,.95/asp),d=13.5*fit;
 cam.aspect=asp;cam.updateProjectionMatrix();cam.position.set(0,2*fit,d);cam.lookAt(0,.1,0);
 scene.fog.near=d-2;scene.fog.far=d+10;
 buildGlyphs();
}
function blit(k,cx,cy,r,g,b){
 const G=glyphs[k],base=cy*ch*gw+cx*cw,off=G.off,al=G.al;
 for(let j=0;j<off.length;j++){const a=al[j];u32[base+off[j]]=0xff000000|((b*a>>8)<<16)|((g*a>>8)<<8)|(r*a>>8)}
}
function draw(t){
 u32.fill(0xff000000);filled.fill(0);
 const RW=cols*S,RH=rows*S,N9=S*S;
 for(let cy=0;cy<rows;cy++)for(let cx=0;cx<cols;cx++){
  let n=0,sr=0,sg=0,sb=0,sl=0,sq=0,zn=1e9,zx=-1e9;
  for(let sy=0;sy<S;sy++){
   const row=(RH-1-cy*S-sy)*RW+cx*S;
   for(let sx=0;sx<S;sx++){
    const p=(row+sx)*4;if(bufC[p+3]<128)continue;
    const r=bufC[p],g=bufC[p+1],b=bufC[p+2],l=(.3*r+.59*g+.11*b)/255,z=bufD[p]*.2157+bufD[p+1]*.000846;
    n++;sr+=r;sg+=g;sb+=b;sl+=l;sq+=l*l;if(z<zn)zn=z;if(z>zx)zx=z;
   }
  }
  if(!n)continue;
  const inv=1/n,L=sl*inv,mx=Math.max(sr,sg,sb);if(mx*inv<5)continue;
  const idx=cy*cols+cx,det=Math.sqrt(Math.max(0,sq*inv-L*L));
  // density: brightness + depth discontinuities (petal overlaps/silhouettes) + surface detail + dither
  const d=Math.pow(L,.75)*(.5+.5*n/N9)*.9+Math.min(.3,Math.max(0,zx-zn-.18)*.9)+Math.min(.15,det*1.4)+(noise[idx]-.5)*.07;
  const k=Math.max(1,Math.min(12,(d*13)|0)),q=255*(.5+.5*Math.min(1,L*1.3))/mx;
  blit(k,cx,cy,sr*q|0,sg*q|0,sb*q|0);filled[idx]=1;
 }
 for(const p of stars){
  const x=(p.x*cols)|0,y=((((p.y-t*p.v)%1)+1)%1*rows)|0,i=y*cols+x;if(filled[i])continue;
  const b=.35+.65*(.5+.5*Math.sin(t*p.s+p.ph)),q=.25+.6*b;
  blit(Math.max(1,Math.round(b*p.m)),x,y,p.c[0]*q|0,p.c[1]*q|0,p.c[2]*q|0);
 }
 ctx.putImageData(img,0,0);
}

/* ---------- Loop, interaction, cleanup ---------- */
let raf=0,drag=0,px=null;const ac=new AbortController(),sig={signal:ac.signal};
function frame(ms){
 raf=requestAnimationFrame(frame);
 const t=ms/1000,w=Math.sin(t*.45)*.5+Math.sin(t*.83+1.3)*.35+Math.sin(t*1.7)*.15; // breeze envelope
 spin.rotation.y=t*.22+drag;
 for(const u of units){const p=u.userData.p;u.rotation.x=.012*Math.sin(t*.9+p)+.016*w*Math.cos(p);u.rotation.z=.014*Math.sin(t*.7+p*1.7)+.018*w*Math.sin(p)}
 const rw=cols*S,rh=rows*S;
 renderer.shadowMap.needsUpdate=true;
 renderer.setRenderTarget(rtC);renderer.render(scene,cam);renderer.readRenderTargetPixels(rtC,0,0,rw,rh,bufC);
 scene.overrideMaterial=depthMat;renderer.setRenderTarget(rtD);renderer.render(scene,cam);scene.overrideMaterial=null;
 renderer.readRenderTargetPixels(rtD,0,0,rw,rh,bufD);
 draw(t);
}
const start=()=>{if(!raf)raf=requestAnimationFrame(frame)},stop=()=>{cancelAnimationFrame(raf);raf=0};
let rt=0;
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(resize,80)},sig);
document.addEventListener('visibilitychange',()=>document.hidden?stop():start(),sig);
addEventListener('pointerdown',e=>{px=e.clientX},sig);
addEventListener('pointermove',e=>{if(px!==null){drag+=(e.clientX-px)*.008;px=e.clientX}},sig);
['pointerup','pointercancel'].forEach(n=>addEventListener(n,()=>{px=null},sig));
addEventListener('pagehide',()=>{
 stop();ac.abort();clearTimeout(rt);
 scene.traverse(o=>{if(o.isMesh){o.geometry.dispose();[].concat(o.material).forEach(m=>m.dispose())}});
 rtC.dispose();rtD.dispose();depthMat.dispose();renderer.dispose();
},{once:true});
resize();start();
})();
</script>
</body>
</html>
